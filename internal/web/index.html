<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>wtfi3</title>
<style>
  :root{
    --bg:#fbf7ff; --card:#ffffff; --ink:#4a4560; --muted:#9a94ad; --line:#efe9f6;
    --accent:#b39ddb; --accent2:#8fd9c8; --peach:#ffb4a2; --lav:#c8b6ff;
    --tx:#f5a3b7; --rx:#8fd9c8; --shadow:0 6px 22px rgba(150,120,190,.13);
    --radius:18px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191424; --card:#221a33; --ink:#ece7f5; --muted:#8b81a5; --line:#2e2440;
      --accent:#c8b6ff; --accent2:#8fd9c8; --shadow:0 6px 22px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:14px/1.55 "Hiragino Maru Gothic ProN","Quicksand",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif}
  a{color:var(--accent)}
  header{padding:18px 22px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .logo{font-size:22px;font-weight:700;letter-spacing:.5px;color:var(--accent)}
  .logo b{color:var(--accent2)}
  .tag{color:var(--muted);font-size:12px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;align-items:center}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;box-shadow:var(--shadow)}
  .pill b{color:var(--ink)}.pill span{color:var(--muted)}
  .mode{border:none;font-weight:700}
  .mode.passive{background:#eef7f3;color:#3aa88b}
  .mode.spoof{background:#ffeef0;color:#e5738a}
  @media (prefers-color-scheme: dark){.mode.passive{background:#1e3a33;color:#8fd9c8}.mode.spoof{background:#3a2230;color:#ffb4c4}}
  .btn{cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:12px;color:var(--ink);box-shadow:var(--shadow);font-family:inherit}
  .btn:hover{border-color:var(--accent)}
  .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  main{padding:6px 22px 26px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.grid2{grid-template-columns:1fr}}
  section{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;margin-bottom:16px}
  h2{font-size:12px;margin:0;padding:13px 18px;color:var(--muted);font-weight:700;letter-spacing:.4px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  h2 .count{background:var(--bg);color:var(--accent);border-radius:999px;padding:2px 9px;font-size:11px}
  .scroll{overflow:auto;max-height:330px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 18px;white-space:nowrap;border-bottom:1px solid var(--line)}
  th{position:sticky;top:0;background:var(--card);color:var(--muted);font-weight:600;font-size:11px}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody tr{transition:background .15s}
  tbody tr:hover td{background:var(--bg)}
  tbody tr:last-child td{border-bottom:none}
  .host{color:var(--accent);font-weight:600}
  .tx{color:var(--tx);font-weight:600}.rx{color:var(--rx);font-weight:600}.mut{color:var(--muted)}
  .chip{padding:2px 9px;border-radius:999px;font-size:11px;background:var(--bg);color:var(--muted);font-weight:600}
  .chip.tcp{background:#eef1ff;color:#7c8cff}.chip.udp{background:#eafaf4;color:#3aa88b}.chip.icmp{background:#fff2ea;color:#e59a6a}
  @media (prefers-color-scheme: dark){.chip.tcp{background:#242a4a;color:#a9b6ff}.chip.udp{background:#1e3a33;color:#8fd9c8}.chip.icmp{background:#3a2c22;color:#ffc59a}}
  .bar{height:6px;background:var(--bg);border-radius:999px;overflow:hidden;min-width:70px}
  .bar>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--lav),var(--accent2))}
  .empty{padding:22px 18px;color:var(--muted);text-align:center}
  #chart{width:100%;height:130px;display:block}
  footer{padding:10px 22px 26px;color:var(--muted);font-size:11px;text-align:center}

  /* simple mode */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .dev{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px}
  .dev .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .dev .name{font-size:16px;font-weight:700;color:var(--ink)}
  .dev .ip{font-size:11px;color:var(--muted)}
  .dev .bw{margin-left:auto;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
  .dev .doing{margin:8px 0 12px;font-size:13px;color:var(--ink);line-height:1.5}
  .svc{display:flex;flex-direction:column;gap:6px}
  .svc .row{display:flex;align-items:center;gap:8px}
  .svc .cat{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .svc .names{font-size:12px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-video{background:#ffe6ee;color:#e5567f}
  .cat-shopping{background:#fff0e0;color:#d98420}
  .cat-email{background:#e7efff;color:#5a7bd8}
  .cat-social{background:#efe6ff;color:#8a5cd8}
  .cat-music{background:#e6faf0;color:#2fa876}
  .cat-messaging{background:#e6f7ff;color:#2f95c4}
  .cat-gaming{background:#eee6ff;color:#7c5cff}
  .cat-cloud{background:#eef1f5;color:#6b7a90}
  .cat-dev{background:#e9eef2;color:#55707f}
  .cat-ads{background:#f2eef0;color:#9a8a92}
  .cat-adult{background:#fde6ea;color:#c94f6d}
  .cat-other{background:var(--bg);color:var(--muted)}
  @media (prefers-color-scheme: dark){
    .cat-video{background:#3a2230;color:#ff9dbd}.cat-shopping{background:#3a2c1c;color:#ffc98a}
    .cat-email{background:#232a4a;color:#a9baff}.cat-social{background:#2c2246;color:#c9a9ff}
    .cat-music{background:#1e3a2e;color:#8fe0b6}.cat-messaging{background:#1c3540;color:#8fd4ef}
    .cat-gaming{background:#282246;color:#b6a9ff}.cat-cloud{background:#2a3038;color:#a9bccf}
    .cat-dev{background:#243038;color:#9fc0cf}.cat-ads{background:#302a2e;color:#c7b3bd}
    .cat-adult{background:#3a2028;color:#f0a0b4}.cat-other{background:var(--bg);color:var(--muted)}
  }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">wtfi<b>3</b></div>
    <div class="tag" data-i18n="tagline"></div>
  </div>
  <div class="stats">
    <span class="pill"><span data-i18n="iface"></span> <b id="iface">-</b></span>
    <span class="pill"><span data-i18n="host"></span> <b id="selfip">-</b></span>
    <span class="pill"><span data-i18n="total"></span> <b id="total">0</b></span>
    <span class="pill"><span data-i18n="up"></span> <b id="up">0</b></span>
    <span class="pill mode passive" id="netmode">passive</span>
    <button id="view" class="btn"></button>
    <button id="lang" class="btn">日本語</button>
  </div>
</header>
<main>
  <section>
    <h2><span data-i18n="throughput"></span><span class="count" id="bw">0</span></h2>
    <canvas id="chart" height="130"></canvas>
  </section>

  <div id="simple">
    <div class="cards" id="cards"></div>
  </div>

  <div id="detailed" hidden>
    <div class="grid2">
      <section>
        <h2><span data-i18n="devices"></span><span class="count" id="ndev">0</span></h2>
        <div class="scroll">
          <table><thead><tr>
            <th data-i18n="th_ip"></th><th data-i18n="th_vendor"></th><th data-i18n="th_mac"></th>
            <th class="num" data-i18n="th_up"></th><th class="num" data-i18n="th_down"></th>
          </tr></thead><tbody id="devs"></tbody></table>
        </div>
      </section>
      <section>
        <h2><span data-i18n="lookups"></span><span class="count" id="ndns">0</span></h2>
        <div class="scroll">
          <table><thead><tr>
            <th data-i18n="th_client"></th><th data-i18n="th_name"></th>
            <th data-i18n="th_type"></th><th data-i18n="th_answer"></th>
          </tr></thead><tbody id="dns"></tbody></table>
        </div>
      </section>
    </div>
    <section>
      <h2><span data-i18n="flows"></span><span class="count" id="nflow">0</span></h2>
      <div class="scroll" style="max-height:420px">
        <table><thead><tr>
          <th data-i18n="th_src"></th><th data-i18n="th_dst"></th><th data-i18n="th_proto"></th>
          <th class="num" data-i18n="th_port"></th><th data-i18n="th_sni"></th>
          <th class="num" data-i18n="th_bytes"></th><th class="num" data-i18n="th_pkts"></th><th></th>
        </tr></thead><tbody id="flows"></tbody></table>
      </div>
    </section>
  </div>
</main>
<footer data-i18n="footer"></footer>

<script>
const I18N = {
  en: {
    tagline:"who is talking to whom on your WiFi",
    iface:"iface", host:"host", total:"total", up:"uptime",
    throughput:"Throughput", devices:"Devices", lookups:"DNS lookups", flows:"Top flows",
    th_ip:"IP", th_vendor:"vendor", th_mac:"MAC", th_up:"up", th_down:"down",
    th_client:"client", th_name:"name", th_type:"type", th_answer:"answer",
    th_src:"source", th_dst:"destination", th_proto:"proto", th_port:"port",
    th_sni:"hostname (SNI)", th_bytes:"bytes", th_pkts:"pkts",
    peak:"peak", none_dev:"no devices yet", none_flow:"no flows yet",
    none_dns:"no DNS seen (encrypted DoH/DoT?)",
    footer:"Refreshed every second. TLS payloads are not decrypted, only metadata (destination, volume, DNS, SNI) is shown.",
    lang:"日本語",
    view_simple:"Simple view", view_detailed:"Detailed view",
    unknown_dev:"Unknown device", this_dev:"This Mac", router:"Router",
    doing_prefix:"Looks like:", quiet:"quiet, no recognizable services yet", up_short:"up", down_short:"down",
    dns_only:"looked up only",
    cat:{video:"Video",shopping:"Shopping",email:"Email",social:"Social",music:"Music",
      messaging:"Messaging",gaming:"Gaming",cloud:"Cloud/Sync",dev:"Developer",
      ads:"Ads/Telemetry",adult:"Adult",other:"Other"},
    act:{video:"watching video",shopping:"shopping",email:"checking email",social:"on social media",
      music:"listening to music",messaging:"messaging",gaming:"gaming",cloud:"syncing with cloud",
      dev:"developer traffic",ads:"ads and telemetry",adult:"adult sites",other:"browsing"}
  },
  ja: {
    tagline:"あなたのWiFiで誰が誰と通信しているか",
    iface:"インターフェース", host:"自分", total:"合計", up:"稼働",
    throughput:"通信量", devices:"デバイス", lookups:"DNS名前解決", flows:"フロー上位",
    th_ip:"IP", th_vendor:"メーカー", th_mac:"MAC", th_up:"上り", th_down:"下り",
    th_client:"端末", th_name:"名前", th_type:"種別", th_answer:"応答",
    th_src:"送信元", th_dst:"宛先", th_proto:"プロトコル", th_port:"ポート",
    th_sni:"ホスト名 (SNI)", th_bytes:"バイト", th_pkts:"パケット",
    peak:"ピーク", none_dev:"デバイス未検出", none_flow:"フロー未検出",
    none_dns:"DNSなし（DoH/DoTで暗号化？）",
    footer:"1秒ごとに更新。TLSの中身は復号しません。表示はメタデータ（宛先・通信量・DNS・SNI）のみ。",
    lang:"English",
    view_simple:"かんたん表示", view_detailed:"くわしい表示",
    unknown_dev:"不明なデバイス", this_dev:"このMac", router:"ルーター",
    doing_prefix:"たぶん:", quiet:"目立った通信なし", up_short:"上り", down_short:"下り",
    dns_only:"名前解決のみ",
    cat:{video:"動画",shopping:"買い物",email:"メール",social:"SNS",music:"音楽",
      messaging:"メッセージ",gaming:"ゲーム",cloud:"クラウド同期",dev:"開発",
      ads:"広告・計測",adult:"アダルト",other:"その他"},
    act:{video:"動画を見ている",shopping:"買い物している",email:"メールを見ている",social:"SNSを見ている",
      music:"音楽を聴いている",messaging:"メッセージのやり取り",gaming:"ゲームをしている",cloud:"クラウド同期",
      dev:"開発関連の通信",ads:"広告・計測通信",adult:"アダルトサイト",other:"閲覧している"}
  }
};

// ---- service classification -------------------------------------------------
// ordered rules: first substring match wins. {re, service, cat}
const RULES = [
  [/(^|\.)youtube\.com|googlevideo\.com|(^|\.)ytimg\.com/, "YouTube", "video"],
  [/nflxvideo|(^|\.)netflix\.com|nflximg/, "Netflix", "video"],
  [/(^|\.)primevideo|aiv-|avodmp4s3|video\.a2z|atv-ps|dmqdd6hw24ucf/, "Prime Video", "video"],
  [/(^|\.)twitch\.tv|ttvnw\.net/, "Twitch", "video"],
  [/tiktok|tiktokcdn|byteoversea|ibyteimg/, "TikTok", "video"],
  [/(^|\.)disneyplus|disney-plus|dssott/, "Disney+", "video"],
  [/hulu|abema|niconico|nicovideo/, "Video", "video"],
  [/mail\.google\.com|(^|\.)gmail\.com|imap|smtp|outlook\.office|mail\.me\.com/, "Mail", "email"],
  [/unagi|amazon\.(co\.)?[a-z]+|media-amazon|images-amazon|ssl-images|amazonpay/, "Amazon", "shopping"],
  [/rakuten|mercari|(^|\.)ebay|aliexpress|shopify|(^|\.)zozo/, "Shopping", "shopping"],
  [/(^|\.)facebook|fbcdn|(^|\.)instagram|cdninstagram|whatsapp/, "Meta", "social"],
  [/(^|\.)twitter\.com|(^|\.)x\.com|twimg/, "X", "social"],
  [/reddit|redditstatic|redditmedia/, "Reddit", "social"],
  [/linkedin|licdn/, "LinkedIn", "social"],
  [/spotify|scdn\.co/, "Spotify", "music"],
  [/(^|\.)music\.apple|itunes\.apple/, "Apple Music", "music"],
  [/soundcloud/, "SoundCloud", "music"],
  [/discord|discordapp/, "Discord", "messaging"],
  [/(^|\.)slack\.com|slack-edge/, "Slack", "messaging"],
  [/(^|\.)line\.me|line-apps|line-scdn/, "LINE", "messaging"],
  [/telegram|(^|\.)t\.me/, "Telegram", "messaging"],
  [/signaler-pa|clients\d?\.google|gcm|fcm|push\.apple|courier\.push/, "Notifications", "cloud"],
  [/icloud|(^|\.)apple\.com|mzstatic|aaplimg|push\.apple/, "Apple", "cloud"],
  [/(^|\.)dropbox|dropboxusercontent/, "Dropbox", "cloud"],
  [/onedrive|sharepoint|live\.com|(^|\.)microsoft\.com|windowsupdate|msftconnecttest/, "Microsoft", "cloud"],
  [/(^|\.)drive\.google|googleapis|gstatic|google\.com/, "Google", "cloud"],
  [/steampowered|steamcommunity|steamstatic|steamcontent/, "Steam", "gaming"],
  [/epicgames|playstation|(^|\.)xbox|nintendo|riotgames|battle\.net/, "Gaming", "gaming"],
  [/github|githubusercontent|gitlab|npmjs|pypi|docker/, "Dev", "dev"],
  [/doubleclick|googlesyndication|googleadservices|adservice|(^|\.)ads?\.|adsystem|adnxs|scorecardresearch|criteo|taboola|outbrain/, "Ads", "ads"],
  [/telemetry|analytics|metrics|crashlytics|sentry|amplitude|mixpanel|segment|insights\.|app-measurement|firebaselog/, "Telemetry", "ads"],
  [/pornhub|phncdn|xvideos|xhcdn|xnxx|xhamster|redtube|dtscdn|rncdn/, "Adult", "adult"],
  [/cloudflare|akamai|fastly|cloudfront|edgekey|edgesuite|llnwd|cdn/, "CDN", "other"],
];
function classify(host){
  host = (host||"").toLowerCase();
  for(const [re,service,cat] of RULES){ if(re.test(host)) return {service,cat}; }
  // fall back to the registrable-ish label (last two labels)
  const parts = host.split(".").filter(Boolean);
  const name = parts.length>=2 ? parts[parts.length-2] : host;
  return {service: name ? name.charAt(0).toUpperCase()+name.slice(1) : host, cat:"other"};
}
const CAT_ORDER = ["video","shopping","social","music","gaming","messaging","email","cloud","dev","adult","ads","other"];

let lang = (()=>{ try{return localStorage.getItem("wtfi3_lang")||"en"}catch(e){return "en"} })();
let view = (()=>{ try{return localStorage.getItem("wtfi3_view")||"simple"}catch(e){return "simple"} })();
const T = () => I18N[lang];
function el(id){return document.getElementById(id)}
const fmtB = n => n>=1e9?(n/1e9).toFixed(2)+"G":n>=1e6?(n/1e6).toFixed(2)+"M":n>=1e3?(n/1e3).toFixed(1)+"k":Math.round(n)+"";
const esc = s => (s||"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function applyLang(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(e=>{ e.textContent = T()[e.dataset.i18n]||e.dataset.i18n; });
  el("lang").textContent = T().lang;
  applyView();
}
function applyView(){
  el("simple").hidden = view!=="simple";
  el("detailed").hidden = view==="simple";
  el("view").textContent = view==="simple" ? T().view_detailed : T().view_simple;
  el("view").classList.toggle("on", view==="simple");
}
el("lang").onclick = ()=>{ lang = lang==="en"?"ja":"en"; try{localStorage.setItem("wtfi3_lang",lang)}catch(e){} applyLang(); tick(); };
el("view").onclick = ()=>{ view = view==="simple"?"detailed":"simple"; try{localStorage.setItem("wtfi3_view",view)}catch(e){} applyView(); tick(); };

function drawChart(series){
  const cv=el("chart"), ctx=cv.getContext("2d");
  const w=cv.clientWidth||600, h=130, dpr=devicePixelRatio||1;
  if(cv.width!==Math.round(w*dpr)){cv.width=w*dpr;cv.height=h*dpr;}
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,w,h);
  const cs=getComputedStyle(document.body);
  const line=cs.getPropertyValue("--line"), acc=cs.getPropertyValue("--accent").trim();
  const max=Math.max(1,...series);
  el("bw").textContent = series.length? fmtB(series[series.length-1])+"B/s · "+T().peak+" "+fmtB(max)+"B/s" : "0";
  ctx.strokeStyle=line;ctx.lineWidth=1;
  for(let i=1;i<4;i++){const y=h*i/4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  if(!series.length) return;
  const n=120, step=w/(n-1), off=n-series.length;
  const path=(close)=>{ctx.beginPath();series.forEach((v,i)=>{const x=(off+i)*step,y=h-(v/max)*(h-10)-5;i?ctx.lineTo(x,y):ctx.moveTo(x,y);});
    if(close){ctx.lineTo((off+series.length-1)*step,h);ctx.lineTo(off*step,h);ctx.closePath();}};
  path(true);
  const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,"rgba(179,157,219,.45)");g.addColorStop(1,"rgba(179,157,219,0)");
  ctx.fillStyle=g;ctx.fill();
  path(false);ctx.strokeStyle=acc;ctx.lineWidth=2;ctx.lineJoin="round";ctx.stroke();
}

// Build a friendly per-device summary from flows + DNS.
function buildSimple(s){
  const selfIP=s.self_ip, gw=s.gateway;
  const devs={};
  const dev = ip => devs[ip] || (devs[ip]={ip, services:{}, tx:0, rx:0});
  (s.devices||[]).forEach(d=>{ const x=dev(d.ip); x.tx=d.tx_bytes; x.rx=d.rx_bytes; x.vendor=d.vendor; x.mac=d.mac; });
  const add = (ip, host, bytes) => {
    if(!ip||!host) return;
    const x=dev(ip), {service,cat}=classify(host);
    const key=cat+"|"+service;
    (x.services[key]=x.services[key]||{service,cat,bytes:0}).bytes += bytes||0;
  };
  (s.flows||[]).forEach(f=>{ if(f.sni) add(f.src, f.sni, f.bytes); });
  (s.dns||[]).forEach(e=> add(e.client, e.name, 0));

  return Object.values(devs).sort((a,b)=>(b.tx+b.rx)-(a.tx+a.rx)).map(x=>{
    const name = x.ip===selfIP ? T().this_dev : x.ip===gw ? T().router
      : (x.vendor && x.vendor!=="randomized?" && !/^[0-9a-f:]+$/.test(x.vendor) ? x.vendor : T().unknown_dev);
    // group services by category, keep top service names per cat
    const cats={};
    Object.values(x.services).forEach(sv=>{
      const c=cats[sv.cat]=cats[sv.cat]||{bytes:0,names:{}};
      c.bytes+=sv.bytes; c.names[sv.service]=(c.names[sv.service]||0)+sv.bytes+1;
    });
    const ordered = Object.keys(cats)
      .sort((a,b)=> (cats[b].bytes-cats[a].bytes) || (CAT_ORDER.indexOf(a)-CAT_ORDER.indexOf(b)));
    return {name, ip:x.ip, tx:x.tx, rx:x.rx, cats, ordered};
  });
}

function renderSimple(s){
  const list=buildSimple(s);
  const wrap=el("cards");
  if(!list.length){ wrap.innerHTML=`<div class="empty">${T().none_dev}</div>`; return; }
  wrap.innerHTML = list.map(d=>{
    // Activity sentence is drawn only from categories with real transferred
    // bytes: a lone DNS lookup (bytes == 0) is not evidence of active use, so
    // it appears as a chip below but never drives the "Looks like" claim.
    const meaningful=d.ordered.filter(c=>c!=="ads"&&c!=="other"&&d.cats[c].bytes>0);
    const phrase = meaningful.length
      ? T().doing_prefix+" "+meaningful.slice(0,3).map(c=>T().act[c]).join(" / ")
      : `<span class="mut">${T().quiet}</span>`;
    const rows = d.ordered.slice(0,6).map(c=>{
      const names=Object.keys(d.cats[c].names).sort((a,b)=>d.cats[c].names[b]-d.cats[c].names[a]).slice(0,4).join(", ");
      const seen=d.cats[c].bytes>0 ? "" : ` <span class="mut">(${T().dns_only})</span>`;
      return `<div class="row"><span class="cat cat-${c}">${T().cat[c]}</span><span class="names">${esc(names)}${seen}</span></div>`;
    }).join("");
    return `<div class="dev">
      <div class="top">
        <span class="name">${esc(d.name)}</span>
        <span class="ip">${esc(d.ip)}</span>
        <span class="bw">${T().up_short} ${fmtB(d.tx)} · ${T().down_short} ${fmtB(d.rx)}</span>
      </div>
      <div class="doing">${phrase}</div>
      <div class="svc">${rows||`<span class="mut">${T().quiet}</span>`}</div>
    </div>`;
  }).join("");
}

function renderDetailed(s){
  const devs=s.devices||[]; el("ndev").textContent=devs.length;
  el("devs").innerHTML = devs.length? devs.map(d=>`<tr>
    <td class="host">${esc(d.ip)||"<span class=mut>?</span>"}</td>
    <td>${esc(d.vendor)}</td><td class="mut">${esc(d.mac)}</td>
    <td class="num tx">${fmtB(d.tx_bytes)}</td><td class="num rx">${fmtB(d.rx_bytes)}</td></tr>`).join("")
    : `<tr><td colspan=5 class=empty>${T().none_dev}</td></tr>`;

  const flows=s.flows||[]; el("nflow").textContent=flows.length;
  const max=Math.max(1,...flows.map(f=>f.bytes));
  el("flows").innerHTML = flows.length? flows.map(f=>`<tr>
    <td>${esc(f.src)}</td><td class="mut">${esc(f.dst)}</td>
    <td><span class="chip ${f.proto}">${esc(f.proto)}</span></td><td class="num">${f.dst_port||""}</td>
    <td class="host">${esc(f.sni)||""}</td>
    <td class="num">${fmtB(f.bytes)}</td><td class="num mut">${f.packets}</td>
    <td><div class="bar"><i style="width:${(f.bytes/max*100).toFixed(1)}%"></i></div></td></tr>`).join("")
    : `<tr><td colspan=8 class=empty>${T().none_flow}</td></tr>`;

  const dns=s.dns||[]; el("ndns").textContent=dns.length;
  el("dns").innerHTML = dns.length? dns.map(d=>`<tr>
    <td class="mut">${esc(d.client)}</td><td class="host">${esc(d.name)}</td>
    <td><span class="chip">${esc(d.type)}</span></td><td class="mut">${esc(d.answer)}</td></tr>`).join("")
    : `<tr><td colspan=4 class=empty>${T().none_dns}</td></tr>`;
}

async function tick(){
  let s; try{ s=await (await fetch("/api/state")).json(); }catch(e){ return; }
  el("iface").textContent=s.iface; el("selfip").textContent=s.self_ip;
  el("total").textContent=s.total_mb.toFixed(1)+" MB";
  el("up").textContent=Math.round(s.uptime_sec)+"s";
  const m=el("netmode");
  m.className="pill mode "+(s.spoof?"spoof":"passive");
  m.textContent=s.spoof?("MITM"+(s.spoof_list&&s.spoof_list.length?" ×"+s.spoof_list.length:"")):"passive";
  drawChart(s.series||[]);
  if(view==="simple") renderSimple(s); else renderDetailed(s);
}
applyLang(); tick(); setInterval(tick,1000);
</script>
</body>
</html>
